name: Build/release

on:
   push:
     #tags:
     #  - 'v*'
   #workflow_dispatch:


jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      dodoc-version: ${{ steps.dodoc-version.outputs.current-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Get Dodoc version
        id: dodoc-version
        run: |
          echo "Reading package.json from package.json"
          PACKAGE_VERSION=$(cat package.json | jq '.version' | tr -d '"')
          echo "current-version=${PACKAGE_VERSION}" >> $GITHUB_OUTPUT
          echo "current-version=${PACKAGE_VERSION}"
  docker:
    runs-on: ubuntu-latest
    needs : meta
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/keomabrun/dodoc:${{needs.meta.outputs.dodoc-version}}
            ghcr.io/keomabrun/dodoc:latest

  electron:
    runs-on: ${{ matrix.os }}
    needs : meta
    env:
      is_tag: ${{ startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, mac-latest]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Package Electron app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          cd electron
          npm install
          npm run dist
      - name: List Env
        run: env
