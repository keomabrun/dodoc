  electron:
    runs-on: ${{ matrix.os }}
    needs: meta
    strategy:
      matrix:
        #os: [ubuntu-latest, windows-latest, macos-latest]
        os: [macos-latest]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Package Electron app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm install
          cd electron
          npm install

          # Verify environment variables are set (without showing values)
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "❌ ERROR: APPLE_ID or APPLE_APP_SPECIFIC_PASSWORD is not set!"
            exit 1
          fi

          npm run dist
      - name: check macOS image
        run: |
          echo "🔍 verify signature"
          codesign -dv electron/dist/mac-arm64/do•doc.app
          codesign -dv electron/dist/dodoc-13.0.10-macos.dmg
          echo "🔍 verify notarisation"
          spctl -a -vvv -t open -vvv --context context:primary-signature electron/dist/dodoc-13.0.10-macos.dmg
